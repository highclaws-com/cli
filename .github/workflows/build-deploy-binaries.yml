name: Build deploy binaries

on:
  push:
    branches: [deploy]

permissions:
  contents: write

jobs:
  build-proxy-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy-helper/go.mod
          cache-dependency-path: proxy-helper/go.sum
      - working-directory: proxy-helper
        run: |
          go test -tags with_utls ./...
          mkdir ../dist
          export CGO_ENABLED=0
          GOOS=linux GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-linux-x64 .
          GOOS=linux GOARCH=arm64 go build -tags with_utls -o ../dist/hc-proxy-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-mac-x64 .
          GOOS=darwin GOARCH=arm64 go build -tags with_utls -o ../dist/hc-proxy-mac-x64 .
          GOOS=windows GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-win.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-helper
          path: dist/*

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: go build -o ../dist/hc-gui-linux-x64 .
          - os: ubuntu-24.04-arm
            build: go build -o ../dist/hc-gui-linux-arm64 .
          - os: macos-latest
            build: |
              GOARCH=arm64 go build -o ../dist/hc-gui-mac-arm64 .
              CGO_ENABLED=1 GOARCH=amd64 go build -o ../dist/hc-gui-mac-x64 .
          - os: windows-latest
            build: go build -o ../dist/hc-gui-win.exe .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libayatana-appindicator3-dev patchelf
      - working-directory: gui
        shell: bash
        run: |
          mkdir ../dist
          ${{ matrix.build }}
      - if: runner.os == 'Linux'
        working-directory: dist
        run: |
          gui=$(ls hc-gui-linux-*)
          lib=${gui#hc-gui-}/lib
          mkdir -p "$lib"
          ldd "$gui" | awk '/lib(ayatana|dbusmenu)/ {print $3}' | xargs -r cp -L -t "$lib"
          for so in "$lib"/*; do patchelf --set-rpath '$ORIGIN' "$so"; done
          patchelf --set-rpath '$ORIGIN/lib' "$gui"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: dist/*

  build-cli:
    needs: build-gui
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bin:linux && npm run bin:mac
      - run: |
          codesign --force --sign - dist/hc-mac-x64
          codesign --force --sign - dist/hc-mac-arm64
          ./dist/hc-mac-arm64 --help
      - uses: actions/download-artifact@v4
        with:
          name: gui-macos-latest
          path: dist
      - working-directory: dist
        run: |
          mv hc-gui-mac-arm64 hc-gui
          chmod +x hc-gui
          ./hc-mac-arm64 &
          swift - <<'SWIFT'
          import Cocoa
          for _ in 0..<30 {
              let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, 0) as! [[String: Any]]
              if windows.contains(where: { $0[kCGWindowOwnerName as String] as? String == "hc-gui" && $0[kCGWindowLayer as String] as? Int == 0 }) { exit(0) }
              Thread.sleep(forTimeInterval: 1)
          }
          exit(1)
          SWIFT
      - uses: actions/upload-artifact@v4
        with:
          name: cli-unix
          path: |
            dist/hc-mac-*
            dist/hc-linux-*

  build-cli-windows:
    needs: build-gui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bin:win
      - run: |
          ./dist/hc-win.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: gui-windows-latest
          path: dist
      - working-directory: dist
        run: |
          Rename-Item hc-gui-win.exe hc-gui.exe
          Start-Process ./hc-win.exe
          foreach ($i in 1..30) {
            if (Get-Process hc-gui -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -eq 'HighClaws') { exit 0 }
            Start-Sleep 1
          }
          throw 'GUI window did not open'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist/hc-win.exe

  release-cli:
    needs: [build-cli, build-cli-windows, build-gui, build-proxy-helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - working-directory: binaries
        run: |
          mkdir ../dist
          for gui in hc-gui-*; do
            platform=${gui#hc-gui-}
            platform=${platform%.exe}
            ext=${gui#hc-gui-$platform}
            mkdir -p $platform
            mv hc-$platform$ext $platform/hc$ext
            mv $gui $platform/hc-gui$ext
            mv hc-proxy-$platform$ext $platform/hc-proxy$ext
            chmod +x $platform/hc*
            if [[ $platform == linux-* ]]; then
              (cd "$platform" && tar -czf "../../dist/hc-$platform.tar.gz" *)
            else
              (cd "$platform" && zip "../../dist/hc-$platform.zip" *)
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HighClaws CLI
          prerelease: false
          files: dist/*
