name: Build deploy binaries

on:
  push:
    branches: [deploy]

permissions:
  contents: write

jobs:
  build-proxy-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy-helper/go.mod
          cache-dependency-path: proxy-helper/go.sum
      - working-directory: proxy-helper
        run: |
          go test -tags with_utls ./...
          mkdir ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-linux-x64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_utls -o ../dist/hc-proxy-linux-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-mac-x64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags with_utls -o ../dist/hc-proxy-mac-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-win.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-helper
          path: dist/*

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: go build -o ../dist/linux-x64/hc-gui .
          - os: ubuntu-24.04-arm
            build: go build -o ../dist/linux-arm64/hc-gui .
          - os: macos-latest
            build: |
              GOARCH=arm64 go build \
                -o ../dist/mac-arm64/hc-gui.app/Contents/MacOS/hc-gui .
              CGO_ENABLED=1 GOARCH=amd64 go build \
                -o ../dist/mac-x64/hc-gui.app/Contents/MacOS/hc-gui .
          - os: windows-latest
            build: |
              go run github.com/tc-hib/go-winres@v0.3.3 simply \
                --arch amd64 --manifest none --icon ../assets/hc.ico
              go build -ldflags -H=windowsgui -o ../dist/win/hc-gui.exe .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libayatana-appindicator3-dev patchelf
      - working-directory: gui
        shell: bash
        run: ${{ matrix.build }}
      - if: runner.os == 'macOS'
        run: |
          for app in dist/mac-*/hc-gui.app; do
            mkdir "$app/Contents/Resources"
            cp gui/Info.plist "$app/Contents/"
            cp assets/hc.icns "$app/Contents/Resources/"
          done
      - if: runner.os == 'Linux'
        working-directory: dist
        run: |
          gui=$(ls linux-*/hc-gui)
          lib=$(dirname "$gui")/lib
          mkdir "$lib"
          ldd "$gui" | awk '/lib(ayatana|dbusmenu)/ {print $3}' | xargs -r cp -L -t "$lib"
          for so in "$lib"/*; do patchelf --set-rpath '$ORIGIN' "$so"; done
          patchelf --set-rpath '$ORIGIN/lib' "$gui"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: dist/*

  build-cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bin:linux && npm run bin:mac
      - run: |
          codesign --force --sign - dist/hc-mac-x64
          codesign --force --sign - dist/hc-mac-arm64
          ./dist/hc-mac-arm64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: cli-unix
          path: dist/*

  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bin:win
      - run: |
          ./dist/hc-win.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/hc-win.exe proxy --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist/*

  release-cli:
    needs: [build-cli, build-cli-windows, build-gui, build-proxy-helper]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - working-directory: binaries
        run: |
          mkdir ../dist
          for platform in */; do
            platform=${platform%/}
            ext=
            bin=$platform
            if [[ $platform == win ]]; then
              ext=.exe
            elif [[ $platform == mac-* ]]; then
              bin=$platform/hc-gui.app/Contents/MacOS
            fi
            mv hc-$platform$ext $bin/hc$ext
            mv hc-proxy-$platform$ext $bin/hc-proxy$ext
            chmod +x $bin/hc*
            if [[ $platform == mac-* ]]; then
              ln -s hc-gui.app/Contents/MacOS/hc $platform/hc
              ln -s hc-gui.app/Contents/MacOS/hc-proxy $platform/hc-proxy
              codesign --force --sign - $bin/hc $bin/hc-proxy
              codesign --force --sign - $platform/hc-gui.app
            fi
            if [[ $platform == linux-* ]]; then
              (cd "$platform" && tar -czf "../../dist/hc-$platform.tar.gz" *)
            else
              (cd "$platform" && zip -ry "../../dist/hc-$platform.zip" .)
            fi
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest dist/* \
            --title "HighClaws CLI" --notes "" --target ${{ github.sha }}
