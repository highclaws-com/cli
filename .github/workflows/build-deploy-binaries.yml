name: Build deploy binaries

on:
  push:
    branches: [deploy]

permissions:
  contents: write

jobs:
  build-proxy-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy-helper/go.mod
          cache-dependency-path: proxy-helper/go.sum
      - working-directory: proxy-helper
        run: |
          go test -tags with_utls ./...
          mkdir ../dist
          GOOS=linux GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -tags with_utls -o ../dist/hc-proxy-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -tags with_utls -o ../dist/hc-proxy-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -tags with_utls -o ../dist/hc-proxy-windows-amd64.exe .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: proxy-helper
          name: Proxy helper
          prerelease: true
          files: dist/*

  build-gui:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build: go build -o ../dist/hc-gui-linux-x64 .
          - os: ubuntu-24.04-arm
            build: go build -o ../dist/hc-gui-linux-arm64 .
          - os: macos-latest
            build: |
              GOARCH=arm64 go build -o ../dist/hc-gui-mac-arm64 .
              CGO_ENABLED=1 GOARCH=amd64 go build -o ../dist/hc-gui-mac-x64 .
          - os: windows-latest
            build: go build -o ../dist/hc-gui-win.exe .
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libgtk-3-dev libayatana-appindicator3-dev
      - working-directory: gui
        shell: bash
        run: |
          mkdir ../dist
          ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: dist/*

  build-cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bin:linux && npm run bin:mac
      - run: |
          codesign --force --sign - dist/hc-mac-x64
          codesign --force --sign - dist/hc-mac-arm64
          ./dist/hc-mac-arm64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: cli-unix
          path: dist/*

  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bin:win
      - run: |
          ./dist/hc-win.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/hc-win.exe proxy --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist/*

  release-cli:
    needs: [build-cli, build-cli-windows, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: |
          for gui in hc-gui-*; do
            platform=${gui#hc-gui-}
            platform=${platform%.exe}
            ext=${gui#hc-gui-$platform}
            mkdir $platform
            mv hc-$platform$ext $platform/hc$ext
            mv $gui $platform/hc-gui$ext
            chmod +x $platform/*
            if [[ $platform == linux-* ]]; then
              tar -czf hc-$platform.tar.gz -C $platform .
            else
              (cd $platform && zip ../hc-$platform.zip *)
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HighClaws CLI
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
